[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lourihna-films"
version = "0.5.1"
description = "Public cinema discovery with Internet Archive, OK.ru and a local library"
license = "MIT"
authors = [{name = "Samuel Seijo Ribeiro"}]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<6.13", "httpx>=0.28,<1", "pydantic>=2.10,<3", "SQLAlchemy>=2.0,<3", "python-dotenv>=1,<2", "ctranslate2>=4.6,<5", "sentencepiece>=0.2,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pyinstaller>=6", "Pillow>=11", "ruff>=0.14"]

[tool.setuptools.packages.find]
include = ["lourihna_films*"]

[tool.setuptools.package-data]
lourihna_films = ["ui/*.qml", "ui/qmldir", "ui/components/*.qml", "ui/components/*.js", "ui/pages/*.qml", "assets/*", "assets/brand/*", "assets/fonts/*", "assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
