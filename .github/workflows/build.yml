name: Verify and package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/package_release.py --check-source
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm lourihna_films.spec
      - name: Windows packaged smoke
        if: runner.os == 'Windows'
        run: python scripts/verify_executable.py dist/lourihna_films/lourihna_films.exe
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable archive and checksums
        run: python scripts/package_release.py --runtime dist/lourihna_films
      - name: Clean source archive
        if: runner.os == 'Windows'
        run: python scripts/package_release.py --source
      - uses: actions/upload-artifact@v4
        with:
          name: lourihna-films-${{ runner.os }}-x86_64
          path: dist/packages/*
          if-no-files-found: error
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and audit inside pinned Ubuntu 20.04
        run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-glibc231-candidate
          path: dist/linux-glibc231/*
          if-no-files-found: error
  linux-compatibility:
    needs: linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['20.04', '22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-glibc231-candidate
          path: dist/linux-glibc231
      - name: Prepare independent runtime OS
        run: docker build --build-arg UBUNTU_VERSION=${{ matrix.ubuntu }} -f packaging/Dockerfile.linux-test -t linux-test .
      - name: Install, launch, play video, update and uninstall without root
        run: |
          set -o pipefail
          docker run --rm --init --shm-size=512m --security-opt seccomp=packaging/chromium-seccomp.json -v "$PWD/dist/linux-glibc231:/input:ro" linux-test 2>&1 | tee compatibility-${{ matrix.ubuntu }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-compatibility-${{ matrix.ubuntu }}
          path: compatibility-*.txt
