name: Verify and package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libopengl0 libnss3 libasound2t64 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm lourihna_films.spec
      - name: Windows packaged smoke
        if: runner.os == 'Windows'
        run: python scripts/verify_executable.py dist/lourihna_films/lourihna_films.exe
      - name: Linux packaged smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/verify_executable.py dist/lourihna_films/lourihna_films
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux portable archive
        if: runner.os == 'Linux'
        run: |
          cp packaging/install-linux.sh dist/lourihna_films/install.sh
          cp README.md LICENSE dist/lourihna_films/
          chmod +x dist/lourihna_films/install.sh
          mkdir -p dist/packages
          tar -czf dist/packages/lourihna-films-0.4.0-linux-x86_64.tar.gz -C dist lourihna_films
      - uses: actions/upload-artifact@v4
        with:
          name: lourihna-films-${{ runner.os }}-x86_64
          path: dist/packages/*
          if-no-files-found: error
