name: Verify and package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libglib2.0-0t64 libdbus-1-3 libfontconfig1 libfreetype6 libxfixes3 libcups2t64 libgtk-3-0t64 libegl1 libgl1 libopengl0 libnss3 libasound2t64 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/package_release.py --check-source
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm lourihna_films.spec
      - name: Windows packaged smoke
        if: runner.os == 'Windows'
        run: python scripts/verify_executable.py dist/lourihna_films/lourihna_films.exe
      - name: Linux packaged smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/verify_executable.py dist/lourihna_films/lourihna_films
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable archive and checksums
        run: python scripts/package_release.py --runtime dist/lourihna_films
      - name: Clean source archive
        if: runner.os == 'Windows'
        run: python scripts/package_release.py --source
      - uses: actions/upload-artifact@v4
        with:
          name: lourihna-films-${{ runner.os }}-x86_64
          path: dist/packages/*
          if-no-files-found: error
